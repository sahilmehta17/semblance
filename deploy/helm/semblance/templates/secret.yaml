apiVersion: v1
kind: Secret
metadata:
  name: {{ include "semblance.fullname" . }}-keys
  labels:
    {{- include "semblance.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Comma-separated API keys. Empty => open mode (no auth), fine for local k3s.
  SEMBLANCE_API_KEYS: {{ join "," .Values.apiKeys | quote }}
